<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>束线保护双路径规划</title>
<style>
  :root {
    --bg: #0f1420; --panel: #171e2e; --line: #2a3550; --text: #e8ecf5;
    --muted: #8b96ad; --accent: #4f8cff; --ok: #34c98e; --warn: #f0a44a;
    --err: #ef5b6e; --chip: #223052;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    line-height: 1.6;
  }
  header { padding: 28px 24px 8px; max-width: 980px; margin: 0 auto; }
  header h1 { font-size: 22px; margin: 0 0 6px; }
  header p { margin: 0; color: var(--muted); font-size: 14px; }
  main { max-width: 980px; margin: 0 auto; padding: 16px 24px 48px; }
  .panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 20px; margin-top: 16px;
  }
  .hidden { display: none; }
  label { font-size: 13px; color: var(--muted); display: block; }
  input {
    background: #0d1320; border: 1px solid var(--line); color: var(--text);
    border-radius: 8px; padding: 8px 10px; font-size: 14px; width: 100%;
    font-family: inherit;
  }
  input:focus { outline: none; border-color: var(--accent); }
  .endpoints { display: flex; gap: 16px; margin-bottom: 14px; }
  .endpoints > div { flex: 1; }
  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left; font-size: 12px; color: var(--muted);
    padding: 6px 8px; border-bottom: 1px solid var(--line); font-weight: 500;
  }
  td { padding: 6px 8px; border-bottom: 1px solid #1e2740; }
  td input { padding: 6px 8px; }
  .toolbar { display: flex; gap: 12px; margin-top: 14px; }
  button {
    border: none; border-radius: 8px; padding: 9px 18px; font-size: 14px;
    cursor: pointer; font-family: inherit;
  }
  #add-row { background: var(--chip); color: var(--text); }
  #submit { background: var(--accent); color: #fff; font-weight: 600; }
  #submit:disabled { opacity: .55; cursor: wait; }
  #audit-btn { background: var(--ok); color: #06281c; font-weight: 600; }
  .del-row { background: transparent; color: var(--muted); padding: 4px 8px; }
  .del-row:hover { color: var(--err); }
  .mini-btn { background: var(--chip); color: var(--text); padding: 4px 12px; font-size: 12px; }
  .mini-btn:hover { outline: 1px solid var(--accent); }
  h2 { font-size: 16px; margin: 0 0 12px; }
  .badge {
    display: inline-block; font-size: 12px; padding: 2px 10px;
    border-radius: 999px; margin-bottom: 12px; font-weight: 600;
  }
  .badge.ok { background: rgba(52,201,142,.15); color: var(--ok); }
  .badge.warn { background: rgba(240,164,74,.15); color: var(--warn); }
  .badge.err { background: rgba(239,91,110,.15); color: var(--err); }
  .chain { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 8px 0; }
  .node {
    background: #0d1320; border: 1px solid var(--line); border-radius: 8px;
    padding: 4px 10px; font-size: 13px; font-weight: 600;
  }
  .seg-chip {
    background: var(--chip); border-radius: 8px; padding: 4px 10px;
    font-size: 12px; color: #bcd0ff; white-space: nowrap;
  }
  .seg-chip b { color: #fff; }
  .seg-chip.hl { outline: 2px solid var(--warn); }
  .arrow { color: var(--muted); }
  .calc { color: var(--muted); font-size: 13px; font-family: ui-monospace, monospace; }
  .total {
    margin-top: 14px; padding: 12px 14px; border-radius: 10px;
    background: rgba(79,140,255,.1); border: 1px solid rgba(79,140,255,.35);
    font-size: 15px;
  }
  .total b { color: var(--accent); font-size: 18px; }
  .path-block { padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; margin-top: 10px; }
  .path-block h3 { margin: 0 0 4px; font-size: 14px; }
  .err-item {
    padding: 8px 12px; border-left: 3px solid var(--err);
    background: rgba(239,91,110,.08); border-radius: 6px; margin-top: 8px; font-size: 14px;
  }
  .err-item code { color: var(--err); font-family: ui-monospace, monospace; }
  .cut-nodes { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 14px; }
  .note { color: var(--muted); font-size: 13px; margin-top: 12px; }
  .busy { color: var(--muted); font-size: 14px; }
  .audit-entry { margin-top: 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .audit-entry .note { margin-top: 0; flex: 1 1 260px; }
  .audit-panel { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 16px; }
  .audit-panel h3 { font-size: 14px; margin: 14px 0 6px; }
  .compare { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 8px; }
  .compare .col { flex: 1 1 320px; }
  .plan { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .plan > h3 { margin: 0 0 8px; font-size: 14px; }
</style>
</head>
<body>
<header>
  <h1>束线保护信号接入 · 双路径规划</h1>
  <p>录入有向光纤段（允许节点重合与并行光纤），提交后求解起点到终点两条边互不重复、总延迟最小的保护链路；求解后可发起最优段审计，逐段判定该段是否在全部最小总延迟方案中不可替代。</p>
</header>
<main>
  <section class="panel">
    <div class="endpoints">
      <div><label>起点</label><input id="source" value="S" autocomplete="off"></div>
      <div><label>终点</label><input id="target" value="T" autocomplete="off"></div>
    </div>
    <table>
      <thead>
        <tr><th style="width:22%">段标识</th><th>起点</th><th>终点</th><th style="width:18%">延迟（非负整数）</th><th style="width:8%"></th></tr>
      </thead>
      <tbody id="seg-body"></tbody>
    </table>
    <div class="toolbar">
      <button id="add-row" type="button">+ 添加光纤段</button>
      <button id="submit" type="button">提交求解</button>
    </div>
  </section>
  <section id="result" class="panel hidden"></section>
</main>

<script>
"use strict";

// 示例草稿：局部最短路 S-A-B-T 占用共享光纤 e2，
// "先最短路再删边"会误判无可行双路；全局最优为 S-A-T 与 S-B-T，总延迟 12。
const SAMPLE = [
  { id: "e1", from: "S", to: "A", delay: 1 },
  { id: "e2", from: "A", to: "B", delay: 1 },
  { id: "e3", from: "B", to: "T", delay: 1 },
  { id: "e4", from: "S", to: "B", delay: 5 },
  { id: "e5", from: "A", to: "T", delay: 5 },
];

const segBody = document.getElementById("seg-body");
const resultPanel = document.getElementById("result");
const submitBtn = document.getElementById("submit");

// 请求序号 + 中止控制器：过期响应不得覆盖新草稿。
let requestSeq = 0;
let inflight = null;
// 最近一次提交的草稿（审计以其为准）与最近一次审计结果缓存。
let lastPayload = null;
let auditCache = null;

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

// 使所有在途响应失效：序号单调递增，旧响应一律丢弃。
function invalidatePending() {
  requestSeq += 1;
  if (inflight) {
    inflight.abort();
    inflight = null;
  }
}

function addRow(seg) {
  const tr = document.createElement("tr");
  tr.innerHTML =
    '<td><input data-f="id" placeholder="如 e6" autocomplete="off"></td>' +
    '<td><input data-f="from" autocomplete="off"></td>' +
    '<td><input data-f="to" autocomplete="off"></td>' +
    '<td><input data-f="delay" inputmode="numeric" autocomplete="off"></td>' +
    '<td><button type="button" class="del-row" title="删除">✕</button></td>';
  if (seg) {
    tr.querySelector('[data-f="id"]').value = seg.id;
    tr.querySelector('[data-f="from"]').value = seg.from;
    tr.querySelector('[data-f="to"]').value = seg.to;
    tr.querySelector('[data-f="delay"]').value = seg.delay;
  }
  tr.querySelector(".del-row").addEventListener("click", () => {
    tr.remove();
    onEdit();
  });
  segBody.appendChild(tr);
}

function collectPayload() {
  const segments = [];
  for (const tr of segBody.querySelectorAll("tr")) {
    const val = (f) => tr.querySelector(`[data-f="${f}"]`).value.trim();
    const rawDelay = val("delay");
    segments.push({
      id: val("id"),
      from: val("from"),
      to: val("to"),
      // 原样上送：非法延迟由服务端定位报错，不在前端掩盖。
      delay: /^-?\d+$/.test(rawDelay) ? parseInt(rawDelay, 10) : rawDelay,
    });
  }
  return {
    source: document.getElementById("source").value.trim(),
    target: document.getElementById("target").value.trim(),
    segments,
  };
}

function clearResult() {
  resultPanel.classList.add("hidden");
  resultPanel.innerHTML = "";
  auditCache = null;
}

// 任何编辑都使旧结论（含审计结论）立即失效，且在途响应不得覆盖新草稿。
function onEdit() {
  invalidatePending();
  clearResult();
}

function showBusy() {
  resultPanel.classList.remove("hidden");
  resultPanel.innerHTML = '<p class="busy">求解中…</p>';
}

function errorsHtml(errors) {
  return (errors && errors.length ? errors : [{ loc: "-", message: "未知错误" }])
    .map((e) => `<div class="err-item"><code>${escapeHtml(e.loc)}</code>：${escapeHtml(e.message)}</div>`)
    .join("");
}

function showErrors(errors) {
  // 出错时清除旧结论，仅展示本次定位错误。
  resultPanel.classList.remove("hidden");
  resultPanel.innerHTML = `<span class="badge err">输入有误，旧结论已清除</span>${errorsHtml(errors)}`;
}

function chainHtml(segments, start, highlightId) {
  let html = `<span class="node">${escapeHtml(start)}</span>`;
  for (const s of segments) {
    const cls = s.id === highlightId ? "seg-chip hl" : "seg-chip";
    html +=
      `<span class="${cls}"><b>${escapeHtml(s.id)}</b> · 延迟 ${escapeHtml(s.delay)}</span>` +
      `<span class="arrow">→</span><span class="node">${escapeHtml(s.to)}</span>`;
  }
  return html;
}

function showPaths(data) {
  const blocks = data.paths.map((p, i) => {
    const terms = p.segments.map((s) => s.delay).join(" + ");
    return `<div class="path-block">
      <h3>路径 ${i + 1} <span class="calc">（延迟 ${p.delay}）</span></h3>
      <div class="chain">${chainHtml(p.segments, data.paths[i].segments[0].from)}</div>
      <div class="calc">复算：${terms} = ${p.delay}</div>
    </div>`;
  }).join("");
  const sum = data.paths.map((p) => p.delay).join(" + ");
  resultPanel.classList.remove("hidden");
  resultPanel.innerHTML = `<span class="badge ok">已求得两条边互不重复的保护链路</span>
    ${blocks}
    <div class="total">最小总延迟：<b>${data.totalDelay}</b> <span class="calc">（${sum} = ${data.totalDelay}）</span></div>
    <div class="audit-entry">
      <button id="audit-btn" type="button">发起最优段审计</button>
      <span class="note">逐段判定：该段是否在全部最小总延迟双路方案中不可替代（必经段），或存在总延迟完全相同的替代链路。</span>
    </div>
    <div id="audit-area"></div>`;
  document.getElementById("audit-btn").addEventListener("click", startAudit);
}

function showCut(data) {
  const nodes = data.cut.sourceSet.map((n) => `<span class="node">${escapeHtml(n)}</span>`).join("");
  const rows = data.cut.edges.map((e) =>
    `<tr><td>${escapeHtml(e.id)}</td><td>${escapeHtml(e.from)}</td><td>${escapeHtml(e.to)}</td><td>${escapeHtml(e.delay)}</td></tr>`
  ).join("");
  resultPanel.classList.remove("hidden");
  resultPanel.innerHTML = `<span class="badge warn">无法形成两条边互不重复的保护链路</span>
    <h2>瓶颈证据（最小割）</h2>
    <label>源侧节点集合（从起点在残余网络中可达）</label>
    <div class="cut-nodes">${nodes}</div>
    <label>全部外出割边（共 ${data.cut.edges.length} 条，容量不足 2，阻断第二条链路）</label>
    <table><thead><tr><th>段标识</th><th>起点</th><th>终点</th><th>延迟</th></tr></thead>
    <tbody>${rows}</tbody></table>
    <p class="note">${escapeHtml(data.message || "")}</p>`;
}

// 一套双路方案（基准或替代）的延迟、边集与双路约束复算。
function planHtml(title, paths, total, highlightId) {
  const blocks = paths.map((p, i) => {
    const terms = p.segments.map((s) => s.delay).join(" + ");
    const edgeSet = p.segments.map((s) => s.id).join(", ");
    return `<div class="path-block">
      <h3>链路 ${i + 1} <span class="calc">（延迟 ${p.delay}）</span></h3>
      <div class="chain">${chainHtml(p.segments, p.segments[0].from, highlightId)}</div>
      <div class="calc">边集 {${escapeHtml(edgeSet)}} · 复算：${terms} = ${p.delay}</div>
    </div>`;
  }).join("");
  const first = new Set(paths[0].segments.map((s) => s.id));
  const shared = paths[1].segments.map((s) => s.id).filter((id) => first.has(id));
  const disjointText = shared.length
    ? `交集 {${escapeHtml(shared.join(", "))}}`
    : "交集 ∅（边互不重复）";
  const sum = paths.map((p) => p.delay).join(" + ");
  return `<div class="plan">
    <h3>${title}</h3>
    ${blocks}
    <div class="calc">双路约束：两边集${disjointText} · 总延迟 ${sum} = ${total}</div>
  </div>`;
}

function renderAudit(area, data) {
  auditCache = data;
  const rows = data.audits.map((a, i) => {
    const badge = a.classification === "mandatory"
      ? '<span class="badge warn">必经段</span>'
      : '<span class="badge ok">可替换</span>';
    return `<tr>
      <td><b>${escapeHtml(a.segmentId)}</b></td>
      <td>${badge}</td>
      <td>
        <button type="button" class="mini-btn" data-view="${i}">查看</button>
        <button type="button" class="mini-btn" data-recheck="${escapeHtml(a.segmentId)}">按段复算</button>
      </td>
    </tr>`;
  }).join("");
  area.innerHTML = `<div class="audit-panel">
    <h2>最优段审计 <span class="calc">（基准总延迟 ${data.totalDelay} · 判定依据：最优二单位流残量网络中的零费用交换环）</span></h2>
    <p class="note">必经段：出现在每一个最小总延迟双路方案中，无等费替代，不提供替代见证；
    可替换段：存在不含该段、总延迟与基准完全相同的替代双路，见证可逐段复算。</p>
    <table>
      <thead><tr><th>基准方案已用段</th><th>归类</th><th>操作</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div id="audit-detail" class="hidden"></div>
  </div>`;
  area.querySelectorAll("[data-view]").forEach((btn) =>
    btn.addEventListener("click", () => showAuditDetail(Number(btn.dataset.view))));
  area.querySelectorAll("[data-recheck]").forEach((btn) =>
    btn.addEventListener("click", () => recheckSegment(btn.dataset.recheck)));
}

// 并列展示基准方案与替代方案的延迟、边集，供复核员逐段核对双路约束。
function showAuditDetail(idx, note) {
  const data = auditCache;
  const detail = document.getElementById("audit-detail");
  if (!data || !detail) return;
  const a = data.audits[idx];
  const noteHtml = note ? `<p class="note">${escapeHtml(note)}</p>` : "";
  detail.classList.remove("hidden");
  if (a.classification === "mandatory") {
    detail.innerHTML = `<h3>段 ${escapeHtml(a.segmentId)} <span class="badge warn">必经段</span></h3>
      ${planHtml("基准方案（被审段已高亮）", data.paths, data.totalDelay, a.segmentId)}
      <p class="note">残余网络中不存在经过该段反向边的零费用交换环：该段出现在<strong>每一个</strong>
      最小总延迟双路方案中，不存在总延迟相同的替代链路，故不提供替代见证。</p>
      ${noteHtml}`;
    return;
  }
  detail.innerHTML = `<h3>段 ${escapeHtml(a.segmentId)} <span class="badge ok">可替换</span></h3>
    <div class="compare">
      <div class="col">${planHtml("基准方案（被审段已高亮）", data.paths, data.totalDelay, a.segmentId)}</div>
      <div class="col">${planHtml(`替代方案（不含 ${escapeHtml(a.segmentId)}）`, a.witness.paths, a.witness.totalDelay, null)}</div>
    </div>
    <p class="note">两套方案总延迟相同（${data.totalDelay} = ${a.witness.totalDelay}），
    延迟与边集均可逐段复算；替代方案不使用段 ${escapeHtml(a.segmentId)}。</p>
    ${noteHtml}`;
}

async function startAudit() {
  invalidatePending();                 // 发起较新的审计：旧结论立即失效
  const ctrl = new AbortController();
  inflight = ctrl;
  const seq = requestSeq;
  const area = document.getElementById("audit-area");
  if (!area || !lastPayload) return;
  auditCache = null;
  area.innerHTML = '<p class="busy">审计中：在最优二单位流残量网络上查找零费用交换环…</p>';
  try {
    const resp = await fetch("/api/segment-audit", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(lastPayload),
      signal: ctrl.signal,
    });
    const data = await resp.json();
    if (seq !== requestSeq) return;    // 已有更新的审计/草稿
    if (!resp.ok) {
      area.innerHTML = errorsHtml(data.errors);
      return;
    }
    if (data.status !== "ok") {
      area.innerHTML = '<p class="note">当前草稿不存在两条边互不重复的保护链路，无基准方案可审计。</p>';
      return;
    }
    renderAudit(area, data);
  } catch (err) {
    if (err.name === "AbortError") return; // 被新请求取代，属正常
    if (seq !== requestSeq) return;
    area.innerHTML = '<div class="err-item"><code>network</code>：审计请求失败，旧结论已清除</div>';
  } finally {
    if (seq === requestSeq) inflight = null;
  }
}

// 按段复算：仅重新审计指定段，并核对与首次判定是否一致。
async function recheckSegment(segmentId) {
  if (!lastPayload || !auditCache) return;
  invalidatePending();
  const ctrl = new AbortController();
  inflight = ctrl;
  const seq = requestSeq;
  try {
    const resp = await fetch("/api/segment-audit", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(Object.assign({}, lastPayload, { segmentId })),
      signal: ctrl.signal,
    });
    const data = await resp.json();
    if (seq !== requestSeq) return;
    if (!resp.ok || data.status !== "ok" || !data.audits || data.audits.length !== 1) return;
    const fresh = data.audits[0];
    const idx = auditCache.audits.findIndex((a) => a.segmentId === segmentId);
    if (idx < 0) return;
    const consistent = JSON.stringify(auditCache.audits[idx]) === JSON.stringify(fresh);
    auditCache.audits[idx] = fresh;
    const area = document.getElementById("audit-area");
    if (!area) return;
    renderAudit(area, auditCache);
    showAuditDetail(idx, consistent
      ? `按段复算完成：段 ${segmentId} 的归类与替代见证同首次判定完全一致。`
      : `按段复算完成：段 ${segmentId} 的审计结果已更新。`);
  } catch (err) {
    if (err.name === "AbortError") return;
  } finally {
    if (seq === requestSeq) inflight = null;
  }
}

async function submit() {
  invalidatePending();                 // 取消上一个未完成的请求
  const ctrl = new AbortController();
  inflight = ctrl;
  const seq = requestSeq;              // 过期响应一律丢弃
  clearResult();                       // 新草稿提交，清除旧结论
  showBusy();
  submitBtn.disabled = true;
  const payload = collectPayload();
  try {
    const resp = await fetch("/api/protected-paths", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
      signal: ctrl.signal,
    });
    const data = await resp.json();
    if (seq !== requestSeq) return;    // 已有更新的草稿/请求
    lastPayload = payload;             // 审计以本次提交的草稿为准
    if (!resp.ok) { showErrors(data.errors); return; }
    if (data.status === "ok") showPaths(data);
    else showCut(data);
  } catch (err) {
    if (err.name === "AbortError") return; // 被新请求取代，属正常
    if (seq !== requestSeq) return;
    showErrors([{ loc: "network", message: "请求失败：" + err.message }]);
  } finally {
    if (seq === requestSeq) submitBtn.disabled = false;
  }
}

document.getElementById("add-row").addEventListener("click", () => {
  addRow();
  onEdit();
});
